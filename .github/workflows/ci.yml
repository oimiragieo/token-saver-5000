name: CI

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install build twine

      - name: Black
        run: |
          python -m black --check src tests scripts

      - name: Ruff
        run: |
          python -m ruff check src tests scripts

      - name: Folder guides (claude.md) in sync
        run: |
          python scripts/check_claude_folder_guides_sync.py

      - name: Workflow and packaging contracts
        run: |
          pytest -q -o addopts="" tests/test_ci_workflows.py tests/test_claude_folder_guides.py tests/test_mcp_packaging.py

  compatibility:
    name: Python Compatibility ${{ matrix.python-version }}
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Core import smoke test
        run: |
          python -c "import src.server, src.mcp_install; print('core imports ok')"

      - name: Compatibility smoke tests
        run: |
          pytest -q -o addopts="" tests/test_health.py tests/test_server_aliases.py tests/test_mcp_packaging.py

  package-validation:
    name: Package Validation
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Check built metadata
        run: |
          python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl

      - name: MCP installer smoke test
        run: |
          TOKEN_SAVER_INSTALL="$(python -c "import pathlib, sys, sysconfig; suffix = '.exe' if sys.platform == 'win32' else ''; print(pathlib.Path(sysconfig.get_path('scripts')) / f'token-saver-install-mcp{suffix}')")"
          "$TOKEN_SAVER_INSTALL" --print-config > generated-mcp-config.json
          python -c "import json, pathlib; cfg = json.loads(pathlib.Path('generated-mcp-config.json').read_text()); assert 'mcpServers' in cfg and 'token-saver' in cfg['mcpServers']"

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*
            generated-mcp-config.json
          retention-days: 7

  full-validation:
    name: Full Validation
    needs:
      - quality-gate
      - compatibility
      - package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Pre-export the ONNX model so model-gated tests actually RUN
        # WHY THIS EXISTS. `test_onnx_torch_free_path.py` guards the torch-free
        # embedding path -- the headline property behind the 3.62GB -> 2.32GB
        # runtime image. Its real-encode arm is
        # `@pytest.mark.skipif(not _model_is_cached())`, a pure filesystem check
        # on `~/.cache/token-saver-5000/<model_name with / -> _>/model.onnx`.
        # Nothing warmed that path here, so the arm SKIPPED on every run --
        # measured on run 32382311294: `test_onnx_torch_free_path.py ....s`,
        # suite total 4186 passed / 19 skipped. A skip reads as green, so the
        # guard for our largest image change was not executing in CI at all.
        #
        # The export mirrors api/Dockerfile's pre-export (AutoTokenizer +
        # ORTModelForFeatureExtraction.export -> save_pretrained) so CI warms the
        # SAME layout production runs on, rather than inventing a second one.
        #
        # NOT `|| echo` like the Dockerfile: there, a failed export degrades to a
        # runtime lazy-export and the build should still ship. Here, a silent
        # failure restores exactly the skip-reads-green state this step exists to
        # remove. It fails the job instead, and says why.
        run: |
          python -c "
          import sys
          from pathlib import Path
          from transformers import AutoTokenizer
          from optimum.onnxruntime import ORTModelForFeatureExtraction
          sys.path.insert(0, '.')
          from src.embeddings_onnx import ONNXEmbeddingManager

          # Derive both from the code under test -- a hardcoded model name or
          # cache path here would silently stop matching the gate the day either
          # default changes, and the arm would go back to skipping.
          m = ONNXEmbeddingManager()
          model_name, cache_dir = m.model_name, m.cache_dir
          cache_dir.mkdir(parents=True, exist_ok=True)
          model_path = cache_dir / model_name.replace('/', '_')

          AutoTokenizer.from_pretrained(model_name, cache_dir=str(cache_dir))
          ORTModelForFeatureExtraction.from_pretrained(
              model_name, export=True, cache_dir=str(cache_dir)
          ).save_pretrained(str(model_path))

          # Assert the gate's OWN predicate, not 'the command exited 0'. This is
          # the only check that proves the skipif will now be False.
          ok = (model_path / 'model.onnx').is_file() or (model_path / 'onnx' / 'model.onnx').is_file()
          assert ok, f'export finished but {model_path} holds no model.onnx -- the skipif would still be True'
          print(f'ONNX model warmed at {model_path}')
          "

      - name: Run full test suite with coverage
        # --timeout converts a single hung test (previously cancelled the whole 45-min
        # job with no gate, #191) into a fast per-test failure that NAMES the culprit.
        # --timeout-method=thread interrupts hangs inside C extensions (torch/onnx model
        # load) that the default signal method cannot. 600s is generous enough for the
        # slowest legit model-load test yet far below the job cap.
        run: |
          python -m pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=70 --ignore=tests/test_performance.py --timeout=600 --timeout-method=thread
