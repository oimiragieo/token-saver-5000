name: MCP Profile Guard

on:
  pull_request:
    branches: [main, develop]
    paths:
      - src/handlers/mcp_core.py
      - src/server.py
      - tests/test_tool_profiles.py
      - tests/test_server_unit.py
      - tests/test_ci_workflows.py
      - .github/workflows/mcp-profile-guard.yml
  push:
    branches: [main, develop, claude/**]
    paths:
      - src/handlers/mcp_core.py
      - src/server.py
      - tests/test_tool_profiles.py
      - tests/test_server_unit.py
      - tests/test_ci_workflows.py
      - .github/workflows/mcp-profile-guard.yml

concurrency:
  group: mcp-profile-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-profile-guard:
    name: MCP Profile Contract
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff pytest pytest-asyncio

      - name: Black (profile guard scope)
        run: |
          python -m black --check src/handlers/mcp_core.py src/server.py tests/test_tool_profiles.py tests/test_server_unit.py tests/test_ci_workflows.py

      - name: Ruff (profile guard scope)
        run: |
          python -m ruff check src/handlers/mcp_core.py src/server.py tests/test_tool_profiles.py tests/test_server_unit.py tests/test_ci_workflows.py

      - name: Profile contract tests
        run: |
          pytest -q -o addopts="" tests/test_tool_profiles.py tests/test_server_unit.py
