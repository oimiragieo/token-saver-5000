name: Legacy Lint (Deprecated)

on:
  workflow_dispatch:

concurrency:
  group: legacy-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  legacy-lint-notice:
    name: Deprecated compatibility workflow
    runs-on: ubuntu-latest

    steps:
      - name: Explain deprecation
        run: |
          echo "This deprecated compatibility workflow has been replaced by ci.yml."
          echo "Use ci.yml for the canonical quality gate, package validation, and full test suite."
          echo "Legacy lint.yml is manual-only to avoid duplicate CI runs."
          echo "## Legacy Workflow Notice" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`lint.yml\` is deprecated and manual-only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Use \`ci.yml\` for required repository validation." >> "$GITHUB_STEP_SUMMARY"
