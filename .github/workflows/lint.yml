name: Lint

# Trigger on push and pull requests to main/develop branches
# Code quality checks should run on every contribution
on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

# Concurrency: Cancel previous lint runs if new commits are pushed
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    # Permissions needed for GitHub API interactions
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    # Checkout repository code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    # Set up Python with pip caching (latest stable version)
    # Lint checks use Python 3.12 (latest stable)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: '**/requirements.txt'

    # Upgrade pip to latest version
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    # Install code quality tools from requirements.txt
    # These are development dependencies
    - name: Install linting tools
      run: |
        pip install black ruff mypy

    # ========================================================================
    # Black - Code Formatter (PEP 8 Compliance)
    # ========================================================================
    # Black provides strict, opinionated code formatting
    # Non-compliance fails the check (enforce consistency)
    - name: Check code formatting with Black
      run: |
        black --check --diff src/ tests/ examples/
      continue-on-error: false

    # ========================================================================
    # Ruff - Fast Python Linter (Production Ready)
    # ========================================================================
    # Ruff is 10-100x faster than pylint and provides comprehensive linting
    # Checks: style, complexity, documentation, security, type-checking hints
    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ examples/ --diff
      continue-on-error: false

    # ========================================================================
    # Ruff Format - Verify formatting (complement to Black)
    # ========================================================================
    # Additional format verification using Ruff's formatter
    - name: Check format with Ruff formatter
      run: |
        ruff format --check src/ tests/ examples/
      continue-on-error: false

    # ========================================================================
    # MyPy - Static Type Checker (Optional)
    # ========================================================================
    # Helps catch type-related bugs before runtime
    # --ignore-missing-imports suppresses errors for untyped dependencies
    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --pretty
      continue-on-error: true  # Type checking is informational only

    # ========================================================================
    # Security Scanning - Bandit (Optional)
    # ========================================================================
    # Scans for common security vulnerabilities in Python code
    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r src/ -ll --format json -o bandit-report.json || true
      continue-on-error: true  # Security scan is informational

    # Upload Bandit report as artifact if generated
    - name: Upload security scan report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 7

    # ========================================================================
    # Documentation Check - Docstring Coverage
    # ========================================================================
    # Verifies that public functions have docstrings
    - name: Check docstring coverage
      run: |
        pip install pydocstyle
        pydocstyle src/ --match='(?!test_).*\.py' --convention=google || true
      continue-on-error: true  # Documentation checks are informational

    # ========================================================================
    # Import Sorting - isort (Optional)
    # ========================================================================
    # Ensures imports are organized and sorted consistently
    - name: Check import sorting with isort
      run: |
        pip install isort
        isort --check-only --diff src/ tests/ examples/
      continue-on-error: true  # Import sorting is informational

    # ========================================================================
    # Complexity Analysis - Radon (Optional)
    # ========================================================================
    # Analyzes code complexity (McCabe, maintainability index)
    - name: Analyze code complexity
      run: |
        pip install radon
        radon cc src/ -a -j > complexity-report.json || true
        radon mi src/ -j > maintainability-report.json || true
      continue-on-error: true  # Complexity analysis is informational

    # Upload complexity reports as artifacts
    - name: Upload complexity reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: complexity-reports
        path: |
          complexity-report.json
          maintainability-report.json
        retention-days: 7

    # ========================================================================
    # Summary Report
    # ========================================================================
    # Generate summary for GitHub PR/workflow UI
    - name: Generate lint summary
      if: always()
      run: |
        echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✓ Formatting checked with Black" >> $GITHUB_STEP_SUMMARY
        echo "✓ Linting checked with Ruff" >> $GITHUB_STEP_SUMMARY
        echo "✓ Type checking with mypy (informational)" >> $GITHUB_STEP_SUMMARY
        echo "✓ Security scanning with Bandit (informational)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Security report: bandit-security-report" >> $GITHUB_STEP_SUMMARY
        echo "- Complexity reports: complexity-reports" >> $GITHUB_STEP_SUMMARY
