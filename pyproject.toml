[project]
name = "semantic-modulator"
version = "0.11.0"
description = "Adaptive Semantic Fidelity MCP Server - Combining Semantic Communication with Fidelity-Preserving Encoding"
authors = [{name = "Token Saver Team"}]
readme = "README.md"
# Python 3.13+ breaks chromadb (pydantic-settings conflict) and has numpy>=2.0 incompatibility.
# Upper bound enforces the supported range stated in CLAUDE.md.
requires-python = ">=3.10,<3.15"
dependencies = [
    "mcp>=0.9.0",
    "sentence-transformers>=3.1.0",  # Security: Fixes CVE-2024-11392/11393/11394
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.5.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.20.0",  # Required for metrics.py
    "aiohttp>=3.9.0",  # Required for http_server.py
    "structlog>=24.1.0",  # Required for structured_logging.py (FINDING-007)
    "orjson>=3.9.0",  # Required for structured_logging.py (FINDING-007)
    "msgpack>=1.0.0",  # Required for embedding_cache.py disk persistence
]

[project.scripts]
# Primary gotcontext entry points (for gotcontext.ai branding)
gotcontext-mcp = "src.server:main"
gotcontext-setup = "src.setup_cli:main"
gotcontext-stats = "src.savings_dashboard:main"
gotcontext-proxy = "src.proxy_cli:main"
# Legacy token-saver entry points (backward compatible)
token-saver-mcp = "src.server:main"
token-saver-install-mcp = "src.mcp_install:main"
token-saver-setup = "src.setup_cli:main"
token-saver-proxy = "src.proxy_cli:main"
token-saver-stats = "src.savings_dashboard:main"

[project.optional-dependencies]
# chromadb is optional: server gracefully falls back to JSON persistence when absent.
# Broken on Python 3.13+ (pydantic-settings conflict). Install only on Python 3.10-3.12.
chromadb = [
    "chromadb>=0.4.0",
]
# ONNX tier: 60-70% memory reduction, 3-5x faster CPU inference. Optional.
onnx = [
    "onnxruntime>=1.16.0",
    "optimum[exporters]>=1.15.0",
]
# Visualization: interactive HTML graph export via pyvis. Optional.
vis = [
    "pyvis>=0.3.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
# All optional features bundled (use on Python 3.10-3.12 only)
all = [
    "chromadb>=0.4.0",
    "onnxruntime>=1.16.0",
    "optimum[exporters]>=1.15.0",
    "pyvis>=0.3.2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--verbose",
]
# Coverage settings — use explicitly: pytest --cov=src --cov-report=term --cov-fail-under=70
# Or: pytest --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=70
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
