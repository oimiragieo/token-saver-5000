apiVersion: v1
kind: Secret
metadata:
  name: token-saver-5000-secrets
  namespace: token-saver-5000
  labels:
    app: token-saver-5000
    component: mcp-server
  annotations:
    description: "Secrets for Token Saver 5000 MCP server (template - DO NOT commit real secrets)"
type: Opaque

# IMPORTANT: This is a TEMPLATE file with placeholder values
# In production, use one of these secret management approaches:
#
# 1. External Secrets Operator (RECOMMENDED):
#    - Sync secrets from AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, HashiCorp Vault
#    - Example: ExternalSecret CRD pointing to AWS Secrets Manager
#
# 2. Sealed Secrets:
#    - Encrypt secrets with Bitnami Sealed Secrets controller
#    - Safe to commit encrypted SealedSecret resources to Git
#
# 3. Manual kubectl create secret:
#    - kubectl create secret generic token-saver-5000-secrets \
#        --from-literal=api-key=<actual-key> \
#        --namespace=token-saver-5000
#
# 4. Helm secrets plugin:
#    - Use helm-secrets with SOPS for encrypted values in Git
#
# NEVER commit actual secrets to version control!

data:
  # Example API key (base64 encoded placeholder)
  # To encode: echo -n "your-api-key" | base64
  # To decode: echo "eW91ci1hcGkta2V5" | base64 -d
  api-key: PLACEHOLDER_BASE64_ENCODED_API_KEY

  # Example authentication token
  auth-token: PLACEHOLDER_BASE64_ENCODED_AUTH_TOKEN

  # Example database password (if using ChromaDB with authentication)
  db-password: PLACEHOLDER_BASE64_ENCODED_DB_PASSWORD

  # Example encryption key for data at rest
  encryption-key: PLACEHOLDER_BASE64_ENCODED_ENCRYPTION_KEY

# Usage in Deployment:
# env:
# - name: API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: token-saver-5000-secrets
#       key: api-key
#
# - name: AUTH_TOKEN
#   valueFrom:
#     secretKeyRef:
#       name: token-saver-5000-secrets
#       key: auth-token

---
# Example: External Secrets Operator integration
# Requires External Secrets Operator installed in cluster
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: token-saver-5000-external-secret
#   namespace: token-saver-5000
# spec:
#   # Refresh interval
#   refreshInterval: 1h
#
#   # Secret store reference (configured separately)
#   secretStoreRef:
#     name: aws-secrets-manager  # Or azure-keyvault, gcp-secret-manager, vault
#     kind: SecretStore
#
#   # Target Kubernetes secret
#   target:
#     name: token-saver-5000-secrets
#     creationPolicy: Owner
#
#   # Data mapping from external secret store
#   data:
#   - secretKey: api-key
#     remoteRef:
#       key: token-saver-5000/api-key  # Path in AWS Secrets Manager
#
#   - secretKey: auth-token
#     remoteRef:
#       key: token-saver-5000/auth-token
#
#   - secretKey: db-password
#     remoteRef:
#       key: token-saver-5000/db-password

---
# Example: Sealed Secret (encrypted secret safe to commit)
# Requires Sealed Secrets controller installed in cluster
# apiVersion: bitnami.com/v1alpha1
