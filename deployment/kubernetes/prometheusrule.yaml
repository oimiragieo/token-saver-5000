apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: token-saver-5000-alerts
  namespace: token-saver-5000
  labels:
    app: token-saver-5000
    component: mcp-server
    # Label for Prometheus Operator to discover this PrometheusRule
    prometheus: kube-prometheus  # Common label for kube-prometheus-stack
  annotations:
    description: "Prometheus alerting rules for Token Saver 5000 MCP server"
spec:
  groups:
  # Group 1: Availability and Health Alerts
  - name: token-saver-5000.availability
    interval: 30s  # Evaluate rules every 30 seconds
    rules:
    # Alert: Pod not ready
    - alert: TokenSaverPodNotReady
      expr: |
        kube_pod_status_ready{namespace="token-saver-5000", condition="true"} == 0
      for: 5m  # Alert if unready for 5 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 pod {{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been unready for more than 5 minutes."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-PodNotReady"

    # Alert: No pods running
    - alert: TokenSaverNoPodsRunning
      expr: |
        sum(kube_pod_status_phase{namespace="token-saver-5000", phase="Running"}) == 0
      for: 2m  # Alert if no pods running for 2 minutes
      labels:
        severity: critical
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has no running pods"
        description: "No Token Saver 5000 pods are running in namespace token-saver-5000. Service is completely down."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-NoPodsRunning"

    # Alert: Pod crash looping
    - alert: TokenSaverPodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="token-saver-5000"}[15m]) > 0.1
      for: 5m  # Alert if restarting more than 0.1 times/sec (6 times/min) for 5 minutes
      labels:
        severity: critical
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-CrashLooping"

  # Group 2: Performance and Resource Alerts
  - name: token-saver-5000.performance
    interval: 30s
    rules:
    # Alert: High CPU usage
    - alert: TokenSaverHighCPU
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="token-saver-5000", container="token-saver"}[5m])) by (pod) > 1.8
      for: 10m  # Alert if CPU > 1.8 cores (90% of 2 core limit) for 10 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 pod {{ $labels.pod }} has high CPU usage"
        description: "Pod {{ $labels.pod }} is using {{ $value }} CPU cores (90% of limit). Consider scaling or investigating performance issues."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-HighCPU"

    # Alert: High memory usage
    - alert: TokenSaverHighMemory
      expr: |
        sum(container_memory_working_set_bytes{namespace="token-saver-5000", container="token-saver"}) by (pod) > 1932735283  # 1.8GB in bytes
      for: 10m  # Alert if memory > 1.8GB (90% of 2GB limit) for 10 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 pod {{ $labels.pod }} has high memory usage"
        description: "Pod {{ $labels.pod }} is using {{ $value | humanize }}B memory (90% of 2GB limit). Risk of OOM kill."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-HighMemory"

    # Alert: Memory near OOM
    - alert: TokenSaverMemoryNearOOM
      expr: |
        sum(container_memory_working_set_bytes{namespace="token-saver-5000", container="token-saver"}) by (pod) > 2040109465  # 1.9GB in bytes
      for: 5m  # Alert if memory > 1.9GB (95% of 2GB limit) for 5 minutes
      labels:
        severity: critical
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 pod {{ $labels.pod }} is near out-of-memory"
        description: "Pod {{ $labels.pod }} is using {{ $value | humanize }}B memory (95% of 2GB limit). OOM kill imminent."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-NearOOM"

    # Alert: High compression latency
    - alert: TokenSaverHighCompressionLatency
      expr: |
        histogram_quantile(0.95, rate(compression_latency_seconds_bucket[5m])) > 0.5
      for: 10m  # Alert if p95 latency > 500ms for 10 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has high compression latency"
        description: "P95 compression latency is {{ $value }}s (threshold: 0.5s). Performance degradation detected."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-HighLatency"

  # Group 3: Application-Specific Alerts
  - name: token-saver-5000.application
    interval: 30s
    rules:
    # Alert: High error rate
    - alert: TokenSaverHighErrorRate
      expr: |
        rate(errors_total{namespace="token-saver-5000"}[5m]) > 0.167  # > 10 errors/min
      for: 5m  # Alert if error rate > 10/min for 5 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has high error rate"
        description: "Error rate is {{ $value }} errors/sec ({{ $value | humanize1024 }} errors/min). Investigate application logs."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-HighErrorRate"

    # Alert: Low cache hit rate
    - alert: TokenSaverLowCacheHitRate
      expr: |
        cache_hit_ratio{namespace="token-saver-5000"} < 0.5
      for: 15m  # Alert if cache hit ratio < 50% for 15 minutes
      labels:
        severity: info
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has low cache hit rate"
        description: "Cache hit ratio is {{ $value }} (threshold: 0.5). Consider increasing cache capacity or investigating cache effectiveness."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-LowCacheHitRate"

    # Alert: Compression ratio degradation
    - alert: TokenSaverLowCompressionRatio
      expr: |
        avg_over_time(compression_ratio{namespace="token-saver-5000"}[30m]) < 0.7
      for: 30m  # Alert if compression ratio < 70% for 30 minutes
      labels:
        severity: info
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has low compression ratio"
        description: "Average compression ratio is {{ $value }} (expected: >0.7). Investigate compression effectiveness."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-LowCompressionRatio"

    # Alert: File sync failures
    - alert: TokenSaverFileSyncFailures
      expr: |
        rate(file_sync_failures_total{namespace="token-saver-5000"}[10m]) > 0.05  # > 3 failures/min
      for: 10m  # Alert if file sync failure rate > 3/min for 10 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has file sync failures"
        description: "File sync failure rate is {{ $value }} failures/sec. Check file permissions and storage availability."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-FileSyncFailures"

  # Group 4: Infrastructure Alerts
  - name: token-saver-5000.infrastructure
    interval: 30s
    rules:
    # Alert: Deployment has insufficient replicas
    - alert: TokenSaverInsufficientReplicas
      expr: |
        kube_deployment_status_replicas_available{namespace="token-saver-5000", deployment="token-saver-5000"} < 2
      for: 5m  # Alert if < 2 replicas available for 5 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 has insufficient replicas"
        description: "Only {{ $value }} replicas are available (minimum: 2). High availability compromised."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-InsufficientReplicas"

    # Alert: HPA at maximum replicas
    - alert: TokenSaverHPAMaxedOut
      expr: |
        kube_horizontalpodautoscaler_status_current_replicas{namespace="token-saver-5000", horizontalpodautoscaler="token-saver-5000-hpa"} >= 10
      for: 15m  # Alert if at max replicas (10) for 15 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 HPA is at maximum replicas"
        description: "HPA has scaled to maximum ({{ $value }} replicas). Consider increasing max replicas or optimizing performance."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-HPAMaxedOut"

    # Alert: Persistent volume near full
    - alert: TokenSaverPVNearFull
      expr: |
        (kubelet_volume_stats_used_bytes{namespace="token-saver-5000"} / kubelet_volume_stats_capacity_bytes{namespace="token-saver-5000"}) > 0.85
      for: 10m  # Alert if PV > 85% full for 10 minutes
      labels:
        severity: warning
        component: mcp-server
      annotations:
        summary: "Token Saver 5000 persistent volume is near full"
        description: "Persistent volume {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full. Consider increasing volume size."
        runbook_url: "https://github.com/your-org/token-saver-5000/wiki/Runbook-PVNearFull"
